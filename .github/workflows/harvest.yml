name: Harvest
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch: {}

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install requests pyyaml
      - name: Harvest
        env:
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          source .venv/bin/activate
          python pipeline/run_harvest.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvested-jsonl
          path: data/harvested.jsonl
